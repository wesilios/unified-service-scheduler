name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore UnifiedSeviceScheduler.sln

      - name: Build
        run: dotnet build UnifiedSeviceScheduler.sln --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test UnifiedSeviceScheduler.sln
          --no-build
          --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults

      - name: Generate HTML coverage report
        if: always()
        run: >
          dotnet tool restore &&
          dotnet tool run reportgenerator
          -reports:"TestResults/**/coverage.cobertura.xml"
          -targetdir:"TestResults/CoverageReport"
          -reporttypes:Html
          -classfilters:"-Microsoft.AspNetCore.OpenApi.Generated"
          -title:"Unified Service Scheduler - Coverage Report"

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-html
          path: ./TestResults/CoverageReport
